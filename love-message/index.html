<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Sound Of My Heart</title>
    <meta name="description" content="Màn hình code rain iLoveU ngọt ngào giải mã thành lời tỏ tình lãng mạn dành riêng cho Thanh Hà." />
    <meta property="og:title" content="The Sound Of My Heart" />
    <meta property="og:description" content="Màn hình code rain iLoveU ngọt ngào giải mã thành lời tỏ tình lãng mạn dành riêng cho Thanh Hà." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Background Code Rain Canvas -->
    <canvas id="codeCanvas"></canvas>

    <!-- Celebration Fireworks/Hearts Canvas -->
    <canvas id="celebrationCanvas"></canvas>

    <!-- Romantic Vignette Overlay -->
    <div class="vignette" id="vignette"></div>

    <!-- Hidden YouTube Player for exact video audio: https://youtu.be/ZzRKtUK-hlw -->
    <div id="youtube-player" style="position: fixed; top: -200px; left: -200px; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -999;"></div>

    <!-- Phone Canvas Container (Hỗ trợ dọc 9:16 và tối ưu xoay ngang trên mobile) -->
    <main class="app-wrapper">
      <div class="phone-screen">
        
        <!-- Clean Header -->
        <header class="header">
          <div class="header-spacing"></div>
        </header>

        <!-- Main Decryption / Story Stage -->
        <section class="main-stage" aria-live="polite">
          
          <!-- Love Letter Opening Stage (Chạm vào lá thư để cùng lúc bật nhạc và chạy chữ) -->
          <div class="letter-stage" id="letterStage">
            <div class="letter-badge-sub">SECRET LETTER // FOR YOU</div>
            
            <div class="envelope-wrapper" id="envelopeBtn" role="button" tabindex="0" aria-label="Mở bức thư tình">
              <div class="envelope" id="envelope">
                <div class="envelope-back"></div>
                <!-- Letter paper inside -->
                <div class="envelope-paper" id="envelopePaper">
                  <div class="paper-header">
                    <span class="paper-to">To:</span>
                    <span class="paper-name" id="paperRecipient">Thanh Hà</span>
                    <span class="paper-emoji">🌸</span>
                  </div>
                  <div class="paper-lines">
                    <div class="paper-line w-75"></div>
                    <div class="paper-line w-50"></div>
                  </div>
                  <div class="paper-footer-heart">❤</div>
                </div>
                <!-- Front pocket of envelope -->
                <div class="envelope-pocket"></div>
                <!-- Top triangular flap -->
                <div class="envelope-flap" id="envelopeFlap"></div>
                <!-- Wax seal in the center -->
                <div class="wax-seal" id="waxSeal">
                  <span class="seal-heart">❤</span>
                </div>
              </div>
              <div class="envelope-aura"></div>
            </div>

            <div class="letter-instruction">
              <div class="letter-title">Có một bức thư gửi riêng cho em...</div>
              <div class="letter-tap-cta">
                <span class="tap-icon-bounce">💌</span>
                <span class="tap-text">Chạm vào lá thư để mở nhé</span>
                <span class="tap-sparkle">✨</span>
              </div>
            </div>
          </div>

          <!-- Typewriter Text Box (Ẩn ban đầu, xuất hiện ngay sau khi mở thư) -->
          <div class="decrypt-box fade-out" id="decryptBox" style="display: none;">
            <div class="text-kicker" id="textKicker" style="display: none;"></div>
            <div class="decrypt-text" id="decryptText"></div>
          </div>

          <!-- Neon Heart Drawing Stage (Step 10) -->
          <div class="heart-stage" id="heartStage">
            <div class="heart-svg-wrapper" id="heartSvgWrapper">
              <!-- Radial backlight aura -->
              <div class="heart-ambient-glow"></div>

              <!-- Animated pulse ripple rings -->
              <div class="heartbeat-pulse-ring ring-1"></div>
              <div class="heartbeat-pulse-ring ring-2"></div>

              <svg class="heart-svg" viewBox="0 0 100 92">
                <defs>
                  <!-- Vibrant neon stroke gradient -->
                  <linearGradient id="heartStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fda4af" />
                    <stop offset="25%" stop-color="#fb7185" />
                    <stop offset="60%" stop-color="#f43f5e" />
                    <stop offset="85%" stop-color="#e11d48" />
                    <stop offset="100%" stop-color="#be123c" />
                  </linearGradient>

                  <!-- Crystal gem inner radial gradient -->
                  <radialGradient id="heartCoreGrad" cx="42%" cy="36%" r="68%">
                    <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.95" />
                    <stop offset="22%" stop-color="#fda4af" stop-opacity="0.9" />
                    <stop offset="55%" stop-color="#f43f5e" stop-opacity="0.8" />
                    <stop offset="85%" stop-color="#be123c" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#881337" stop-opacity="0.95" />
                  </radialGradient>

                  <!-- Specular glass reflection gradient -->
                  <linearGradient id="heartGlassSpec" x1="20%" y1="10%" x2="45%" y2="70%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
                    <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                  </linearGradient>

                  <!-- Multi-layered neon glow filter -->
                  <filter id="heartGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blurSmall" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="6.5" result="blurMed" />
                    <feMerge>
                      <feMergeNode in="blurMed" />
                      <feMergeNode in="blurSmall" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>

                <!-- Soft blurred shadow aura -->
                <path
                  class="heart-shadow-layer"
                  d="M 50,28 C 48,15 32,7 18,17 C 4,27 6,46 22,63 C 32,74 44,83 50,88 C 56,83 68,74 78,63 C 94,46 96,27 82,17 C 68,7 52,15 50,28 Z"
                />

                <!-- Luminous crystal heart body (Fades in smoothly) -->
                <path
                  id="heartFill"
                  class="heart-fill-body"
                  d="M 50,28 C 48,15 32,7 18,17 C 4,27 6,46 22,63 C 32,74 44,83 50,88 C 56,83 68,74 78,63 C 94,46 96,27 82,17 C 68,7 52,15 50,28 Z"
                  fill="url(#heartCoreGrad)"
                />

                <!-- Glass / crystal specular highlight on top lobe -->
                <path
                  class="heart-glass-highlight"
                  d="M 23,21 C 14,27 15,39 24,51 C 27,45 24,33 33,25 C 38,20 44,21 47,24 C 44,18 32,15 23,21 Z"
                  fill="url(#heartGlassSpec)"
                />

                <!-- Animated Neon Outline -->
                <path
                  id="heartOutline"
                  class="heart-outline"
                  d="M 50,28 C 48,15 32,7 18,17 C 4,27 6,46 22,63 C 32,74 44,83 50,88 C 56,83 68,74 78,63 C 94,46 96,27 82,17 C 68,7 52,15 50,28 Z"
                  stroke="url(#heartStrokeGrad)"
                  filter="url(#heartGlowFilter)"
                />
              </svg>

              <!-- Particle constellation (magical stars, glowing dots, floating micro-hearts) -->
              <div class="heart-particles" id="heartParticles"></div>
            </div>
          </div>

          <!-- Final Proposal Question & Action Buttons -->
          <div class="question-box" id="questionBox">
            <div class="question-recipient" id="questionRecipient">Thanh Hà</div>
            <div class="question-text">Em đồng ý làm người yêu anh nhé?</div>
            <div class="btn-group">
              <button id="btnAccept" class="btn-primary" type="button">
                Đồng ý ❤️
              </button>
              <button id="btnThink" class="btn-secondary" type="button">
                Để em suy nghĩ 💗
              </button>
            </div>
            <div class="think-response" id="thinkResponse">
              Không sao cả ❤️<br />
              Anh sẽ chờ câu trả lời của em.
            </div>
          </div>

          <!-- Post-Acceptance Celebration Message -->
          <div class="success-stage" id="successStage">
            <div class="success-heart-icon">❤️</div>
            <div class="success-line-1">Vậy từ hôm nay...</div>
            <div class="success-line-2">Chúng ta cùng viết tiếp câu chuyện này nhé.</div>
            <div class="success-tagline">THE BEGINNING OF US</div>
            <button class="replay-btn" id="replayBtn" type="button">
              ↺ Xem lại
            </button>
          </div>

        </section>

        <!-- Subtle Bottom Space -->
        <footer class="footer-space">
          <span class="footer-hint"></span>
        </footer>

      </div>
    </main>

    <!-- Main Logic Script -->
    <script type="module" src="./script.js"></script>
  </body>
</html>
